services:
  - type: web
    name: sanjay-ki-duniya
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 server:app
    healthCheckPath: /api/health
    envVars:
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: CACHE_TTL_SECONDS
        value: "30"
